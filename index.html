<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Msaidizi wa Familia — Rusimbamanga</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --dark:    #0f0720;
    --dark2:   #1a0a2e;
    --dark3:   #2d1054;
    --accent:  #4f3b8c;
    --gold:    #d4a017;
    --gold-lt: #f5d57a;
    --gold-dk: #a07010;
    --text:    #e8e0f5;
    --text-sub:#a898c8;
    --bubble-user: #2d1054;
    --bubble-ai:   #1a1035;
    --border:  rgba(212,160,23,0.18);
    --radius:  18px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dark);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

body::before {
    content:'';
    position:fixed; inset:0; z-index:0;
    background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(79,59,140,0.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(212,160,23,0.08) 0%, transparent 55%),
        repeating-linear-gradient(45deg, transparent, transparent 30px, rgba(255,255,255,0.012) 30px, rgba(255,255,255,0.012) 60px);
    pointer-events:none;
}

/* ── Header ── */
.chat-header {
    position: relative; z-index: 10;
    background: linear-gradient(135deg, var(--dark2), var(--dark3));
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}
.header-avatar {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--gold-dk), var(--gold), var(--gold-lt));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 14px rgba(212,160,23,0.35);
    flex-shrink: 0;
    animation: avatarPulse 4s ease-in-out infinite;
}
@keyframes avatarPulse {
    0%,100%{ box-shadow: 0 4px 14px rgba(212,160,23,0.35); }
    50%    { box-shadow: 0 4px 22px rgba(212,160,23,0.6); }
}
.header-info { flex:1; }
.header-info h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 15px; font-weight: 900;
    letter-spacing: 0.06em;
    color: var(--gold-lt);
    line-height: 1.2;
}
.header-info p {
    font-size: 11.5px; color: var(--text-sub);
    margin-top: 2px;
}
.status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 5px;
    animation: blink 2s ease-in-out infinite;
}
@keyframes blink {
    0%,100%{ opacity:1; } 50%{ opacity:0.4; }
}
.header-badge {
    background: rgba(212,160,23,0.12);
    border: 1px solid rgba(212,160,23,0.25);
    color: var(--gold-lt);
    font-size: 10px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
    letter-spacing: 0.04em;
}

/* ── Messages ── */
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative; z-index: 1;
    scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

.msg {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: msgIn .3s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes msgIn {
    from { opacity:0; transform: translateY(12px) scale(0.96); }
    to   { opacity:1; transform: translateY(0) scale(1); }
}
.msg.user { margin-left: auto; flex-direction: row-reverse; }
.msg.ai   { margin-right: auto; }

.msg-avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; align-self: flex-end;
}
.msg.ai   .msg-avatar { background: linear-gradient(135deg,var(--gold-dk),var(--gold)); }
.msg.user .msg-avatar { background: var(--accent); }

.msg-bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13.5px;
    line-height: 1.65;
    max-width: 100%;
    word-break: break-word;
}
.msg.ai .msg-bubble {
    background: var(--bubble-ai);
    border: 1px solid rgba(212,160,23,0.12);
    border-bottom-left-radius: 5px;
    color: var(--text);
}
.msg.user .msg-bubble {
    background: var(--bubble-user);
    border: 1px solid rgba(212,160,23,0.2);
    border-bottom-right-radius: 5px;
    color: var(--text);
}
.msg-time {
    font-size: 10px; color: var(--text-sub);
    margin-top: 4px;
}
.msg.user .msg-time { text-align: right; }

/* ── Typing ── */
.typing-indicator {
    display: flex; gap: 10px;
    max-width: 85%;
    animation: msgIn .3s ease both;
}
.typing-bubble {
    background: var(--bubble-ai);
    border: 1px solid rgba(212,160,23,0.12);
    border-bottom-left-radius: 5px;
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex; gap: 5px; align-items: center;
}
.typing-bubble span {
    width: 7px; height: 7px;
    background: var(--gold);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
}
.typing-bubble span:nth-child(2) { animation-delay: .2s; }
.typing-bubble span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%        { transform:translateY(-6px); opacity:1; }
}

/* ── Welcome card ── */
.welcome-card {
    background: linear-gradient(135deg, rgba(45,16,84,0.6), rgba(26,10,46,0.8));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 20px;
    margin: 4px 0 6px;
    text-align: center;
    backdrop-filter: blur(10px);
}
.welcome-card h2 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 16px; font-weight: 900;
    color: var(--gold-lt);
    letter-spacing: 0.05em;
    margin-bottom: 7px;
}
.welcome-card p {
    font-size: 12.5px; color: var(--text-sub);
    line-height: 1.6; margin-bottom: 14px;
}
.quick-btns {
    display: flex; flex-wrap: wrap; gap: 7px;
    justify-content: center;
}
.quick-btn {
    background: rgba(212,160,23,0.1);
    border: 1px solid rgba(212,160,23,0.25);
    color: var(--gold-lt);
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 11.5px; font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: 'DM Sans', sans-serif;
}
.quick-btn:hover {
    background: rgba(212,160,23,0.22);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(212,160,23,0.2);
}

/* ── Input ── */
.chat-input-wrap {
    position: relative; z-index: 10;
    background: linear-gradient(to top, var(--dark2), transparent);
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
}
.input-row {
    display: flex; gap: 10px; align-items: flex-end;
    background: rgba(45,16,84,0.7);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    backdrop-filter: blur(10px);
    transition: border-color .2s;
}
.input-row:focus-within {
    border-color: rgba(212,160,23,0.5);
    box-shadow: 0 0 0 3px rgba(212,160,23,0.08);
}
#userInput {
    flex: 1;
    background: transparent;
    border: none; outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; line-height: 1.5;
    resize: none;
    max-height: 120px; min-height: 24px;
    padding: 4px 0;
}
#userInput::placeholder { color: var(--text-sub); }

.send-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold-dk), var(--gold));
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
    transition: all .2s;
    box-shadow: 0 3px 12px rgba(212,160,23,0.3);
}
.send-btn:hover { transform: scale(1.08); box-shadow: 0 5px 18px rgba(212,160,23,0.5); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { background: var(--accent); opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.input-hint {
    text-align: center;
    font-size: 10.5px; color: var(--text-sub);
    margin-top: 8px;
}

/* ── Markdown ── */
.msg-bubble strong { color: var(--gold-lt); font-weight: 700; }
.msg-bubble em { color: #c4b5fd; font-style: italic; }
.msg-bubble code {
    background: rgba(212,160,23,0.1);
    border: 1px solid rgba(212,160,23,0.2);
    border-radius: 5px; padding: 1px 6px;
    font-family: monospace; font-size: 12px;
    color: var(--gold-lt);
}
.msg-bubble ul { padding-left: 18px; margin: 6px 0; }
.msg-bubble li { margin-bottom: 4px; }
.msg-bubble p { margin-bottom: 6px; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble h3 { color: var(--gold-lt); font-size: 14px; margin-bottom: 6px; }

@media (max-width: 480px) {
    .msg { max-width: 95%; }
    .chat-header { padding: 12px 14px; }
    .header-badge { display: none; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="chat-header">
    <div class="header-avatar">🤖</div>
    <div class="header-info">
        <h1>MSAIDIZI WA FAMILIA</h1>
        <p><span class="status-dot"></span>Anafanya kazi • Rusimbamanga System</p>
    </div>
    <div class="header-badge">Gemini AI</div>
</header>

<!-- Messages -->
<div class="chat-messages" id="chatMessages">
    <div class="welcome-card">
        <h2>Karibu! 👋</h2>
        <p>
            Mimi ni msaidizi wako wa familia ya Rusimbamanga.<br>
            Ninaweza kukusaidia na maswali mbalimbali. Uliza chochote!
        </p>
        <div class="quick-btns">
            <button class="quick-btn" onclick="sendQuick('Unaweza kunisaidia na nini?')">🤔 Unaweza nini?</button>
            <button class="quick-btn" onclick="sendQuick('Niambie kuhusu mfumo wa familia')">👨‍👩‍👧 Mfumo wa Familia</button>
            <button class="quick-btn" onclick="sendQuick('Jinsi ya kutumia export ya taarifa')">📊 Export Taarifa</button>
            <button class="quick-btn" onclick="sendQuick('Saidia kuandika salamu ya familia')">✉️ Salamu ya Familia</button>
        </div>
    </div>
</div>

<!-- Input -->
<div class="chat-input-wrap">
    <div class="input-row">
        <textarea
            id="userInput"
            placeholder="Andika swali lako hapa..."
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <p class="input-hint">Enter = Tuma &nbsp;|&nbsp; Shift+Enter = Mstari mpya</p>
</div>

<script>
// ── Proxy URL — Vercel yako ────────────────────────────
const PROXY_URL = 'https://rusimbamanga-family.vercel.app/api/chat';

const SYSTEM_PROMPT = `Wewe ni msaidizi wa mfumo wa familia ya Rusimbamanga, uliotengenezwa na Jafeth Ntigamagwa.

Majukumu yako:
- Kusaidia wanafamilia na maswali yoyote wanayouliza
- Kutoa maelezo kuhusu mfumo wa usimamizi wa familia
- Kusaidia kuandika nyaraka, barua, na mawasiliano ya familia
- Kutoa ushauri wa jumla kwa Kiswahili
- Kujibu maswali kuhusu historia, utamaduni, na maisha ya familia

Kanuni:
- Jibu kwa Kiswahili safi na rahisi kuelewa
- Kuwa na heshima na upole wakati wote
- Kama haujui kitu, sema wazi badala ya kukisia
- Jibu kwa ufupi lakini kamili

Mfumo huu unasimamia taarifa za wana ukoo wa Rusimbamanga ikiwemo makazi, elimu, hali ya ndoa, na hali ya maisha ya kila mwanafamilia.`;

let conversationHistory = [];

// ── Helpers ───────────────────────────────────────────
function now() {
    return new Date().toLocaleTimeString('sw', { hour:'2-digit', minute:'2-digit' });
}
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function scrollBottom() {
    const el = document.getElementById('chatMessages');
    el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
}
function parseMarkdown(text) {
    return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>');
}

function appendMsg(role, text) {
    const wrap = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const avatar = role === 'ai' ? '🤖' : '👤';
    div.innerHTML = `
        <div class="msg-avatar">${avatar}</div>
        <div>
            <div class="msg-bubble">${parseMarkdown(text)}</div>
            <div class="msg-time">${now()}</div>
        </div>`;
    wrap.appendChild(div);
    scrollBottom();
}

function showTyping() {
    const wrap = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'typing-indicator'; div.id = 'typingIndicator';
    div.innerHTML = `
        <div style="width:34px;height:34px;border-radius:10px;
            background:linear-gradient(135deg,#a07010,#d4a017);
            display:flex;align-items:center;justify-content:center;
            font-size:16px;align-self:flex-end;">🤖</div>
        <div class="typing-bubble">
            <span></span><span></span><span></span>
        </div>`;
    wrap.appendChild(div);
    scrollBottom();
}
function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

// ── Send ──────────────────────────────────────────────
async function sendMessage() {
    const input = document.getElementById('userInput');
    const text  = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;

    appendMsg('user', text);
    conversationHistory.push({ role: 'user', parts: [{ text }] });
    showTyping();

    try {
        const response = await fetch(PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
                contents: conversationHistory,
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 1024,
                }
            })
        });

        const data = await response.json();

        if (data.error) throw new Error(data.error.message || 'Hitilafu ya API');

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Samahani, sijapata jibu.';
        conversationHistory.push({ role: 'model', parts: [{ text: reply }] });

        removeTyping();
        appendMsg('ai', reply);

    } catch (err) {
        removeTyping();
        let msg = '⚠️ Hitilafu imetokea. ';
        if (err.message.includes('Failed to fetch') || err.message.includes('network')) {
            msg += 'Hakuna muunganiko wa internet. Jaribu tena.';
        } else if (err.message.includes('QUOTA')) {
            msg += 'Umefika kikomo cha API. Jaribu baadaye.';
        } else {
            msg += err.message;
        }
        appendMsg('ai', msg);
    }

    btn.disabled = false;
    input.focus();
}

function sendQuick(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
}

document.getElementById('userInput').focus();
</script>
</body>
</html>
